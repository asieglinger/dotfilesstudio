# Tmux Configuration
# Dark theme with vim keybindings and useful plugins

# Set prefix to Ctrl-a (easier to reach than Ctrl-b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Enable mouse support
set -g mouse on

# Set 256 color terminal
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Reload config file
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Vim mode
set-window-option -g mode-keys vi

# Copy mode vim bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Faster key repetition
set -s escape-time 0

# Increase scrollback buffer size
set -g history-limit 50000

# Display tmux messages for 4 seconds
set -g display-time 4000

# Refresh status more often
set -g status-interval 5

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

# Easier window navigation
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Don't rename windows automatically
set-option -g allow-rename off

# Quiet
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# Status bar configuration (Gruvbox dark theme)
set -g status-position bottom
set -g status-style 'bg=#3c3836 fg=#ebdbb2'
set -g status-left '#[fg=#282828,bg=#a89984,bold] #S #[fg=#a89984,bg=#3c3836]'
set -g status-right '#[fg=#504945,bg=#3c3836]#[fg=#a89984,bg=#504945] %Y-%m-%d #[fg=#ebdbb2] %H:%M #[fg=#282828,bg=#a89984,bold] #h '
set -g status-right-length 50
set -g status-left-length 20

# Window status
setw -g window-status-current-style 'fg=#282828 bg=#fabd2f bold'
setw -g window-status-current-format ' #I#[fg=#282828]:#[fg=#282828]#W#[fg=#282828]#F '
setw -g window-status-style 'fg=#bdae93 bg=#504945'
setw -g window-status-format ' #I#[fg=#bdae93]:#[fg=#bdae93]#W#[fg=#bdae93]#F '

# Pane borders
set -g pane-border-style 'fg=#504945'
set -g pane-active-border-style 'fg=#a89984'

# Message style
set -g message-style 'fg=#282828 bg=#fabd2f bold'

# Clock mode
set -g clock-mode-colour '#a89984'

# Plugins (using Tmux Plugin Manager)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Plugin configurations
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# macOS specific settings for tmux-yank
set -g @yank_selection_mouse 'clipboard'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'